[versions]
agp = "8.13.0"
kotlin = "1.9.24"
coreKtx = "1.13.1"
appcompat = "1.7.0"
recyclerview = "1.3.2"
media3 = "1.4.1"
coil = "2.7.0"
material = "1.12.0"
junit = "4.13.2"
